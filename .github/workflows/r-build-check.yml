name: r-build-check
on:
    pull_request:
        branches: ['master', 'dev']
    workflow_dispatch:

concurrency:
    group: r-build-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build-check:
        uses: FertigLab/actions/.github/workflows/r-build-check.yml@v1
        secrets: inherit
